# ============================================================
# SOFIA IA — Consultora Digital de Terapia Capilar
# Deploy config para Railway (https://railway.com)
# ============================================================
#
# ARQUITETURA DO PROJETO:
# ─────────────────────────────────────────────────────────────
# Este é um servidor Node.js monolítico (sem Express) que opera como:
#   1. Webhook receiver para WhatsApp via UAZAPI
#   2. API REST com JWT auth para dashboard administrativo
#   3. WebSocket server para real-time dashboard updates
#   4. Motor de IA conversacional (GPT-4o-mini via OpenAI)
#
# ESTRUTURA DE ROTAS (index.js):
# ─────────────────────────────────────────────────────────────
# PÚBLICAS (sem auth):
#   GET  /health                          → Health check simples
#   GET  /metrics                         → Métricas completas (KPIs, A/B, etc.)
#   POST /webhook                         → Webhook UAZAPI WhatsApp
#   POST /api/messages                    → Endpoint genérico de mensagens
#   POST /api/auth/signup                 → Cadastro de usuário dashboard
#   POST /api/auth/login                  → Login → retorna JWT token
#   POST /api/auth/forgot-password        → Recuperação de senha
#   GET  /dashboard                       → Serve dashboard.html (SPA)
#
# AUTENTICADAS (JWT Bearer token):
#   GET  /api/dashboard/overview          → KPIs, funil, volume por hora
#   GET  /api/dashboard/conversations     → Conversas ativas + histórico
#   GET  /api/dashboard/leads             → Leads com perfil e sentimento
#   GET  /api/dashboard/appointments      → Agendamentos do dia
#   GET  /api/dashboard/kpis              → Latência, tokens, sentimento
#   GET  /api/dashboard/ab-test           → Variantes A/B com métricas
#   GET  /api/dashboard/system            → Circuit breakers, self-healing
#   GET  /api/dashboard/security          → Auditoria, LGPD, injeções
#   GET  /api/dashboard/knowledge-base    → Documentos + gaps
#   POST /api/dashboard/knowledge-base    → Adicionar documento à KB
#   POST /api/dashboard/conversations/:id/handoff → Transferir para humano
#   POST /api/dashboard/lgpd/export       → Exportar dados do cliente
#   POST /api/dashboard/lgpd/delete       → Excluir dados (LGPD)
#
# LEGADO (backward compat):
#   GET  /dashboard/data                  → JSON com dados agregados
#   GET  /dashboard/health-check          → Health check dos serviços
#
# WebSocket: ws://HOST/ws/dashboard?token=JWT
#
# MÓDULOS INTERNOS:
# ─────────────────────────────────────────────────────────────
#   index.js              → Servidor HTTP principal + todas as rotas
#   ai.js                 → Motor GPT-4o-mini (getSofiaResponse)
#   auth.js               → JWT auth (signup/login/verify/middleware)
#   wsManager.js          → WebSocket server para dashboard real-time
#   knowledgeBase.js      → RAG com embeddings OpenAI (13 docs)
#   conversationManager.js→ Estado das conversas (new/active/closed)
#   clientMemory.js       → Perfil persistente do cliente
#   messagingClient.js    → Client UAZAPI para envio WhatsApp
#   dashboardApi.js       → Agrega dados de todos os módulos
#   kpiTracker.js         → Métricas de performance
#   abTesting.js          → Teste A/B de variantes de prompt
#   intentFlow.js         → Detecção e tracking de intenções
#   inputSanitizer.js     → Proteção contra injeção de prompt
#   topicBlacklist.js     → Bloqueio de tópicos fora do escopo
#   auditLogger.js        → Trilha de auditoria LGPD
#   selfHealing.js        → Auto-recuperação de erros
#   swop.js               → Circuit breaker pattern
#   feegow.js             → Integração com agenda Feegow
#   database.js           → Persistência PostgreSQL / in-memory
#   dashboard.html        → SPA do dashboard (Chart.js, auth, WS)
#
# VARIÁVEIS DE AMBIENTE REQUERIDAS:
# ─────────────────────────────────────────────────────────────
#   OPENAI_API_KEY        → Chave API OpenAI (obrigatória)
#   PORT                  → Porta do servidor (Railway define automaticamente)
#   UAZAPI_BASE_URL       → URL base UAZAPI (https://free.uazapi.com)
#   UAZAPI_TOKEN          → Token da instância UAZAPI
#   JWT_SECRET            → Secret para tokens JWT do dashboard
#   FEEGOW_TOKEN          → Token API Feegow (agenda médica)
#   DATABASE_URL          → PostgreSQL connection string (opcional)
#   ADMIN_PHONES          → Telefones admin separados por vírgula
#
# IMPORTANTE PARA A IA DO RAILWAY:
# ─────────────────────────────────────────────────────────────
# - NÃO usar Express — o servidor é http.createServer nativo
# - O callback do server é async (req, res) => { }
# - Todas as rotas estão em index.js dentro do callback
# - Autenticação JWT usa o módulo auth.js (Bearer token)
# - WebSocket roda no mesmo server HTTP (path /ws/dashboard)
# - dashboard.html é servido como arquivo estático via fs.readFileSync
# - A porta é definida por process.env.PORT (Railway injeta automaticamente)
# - Não há build step — é Node.js puro sem transpilação
# ============================================================

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "node index.js"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
